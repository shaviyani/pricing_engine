<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Pricing Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%); }
        .login-card { animation: slideUp 0.4s ease-out; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .input-field:focus { box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">

    <div class="login-card w-full max-w-sm">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-blue-600 rounded-xl mb-4">
                <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                </svg>
            </div>
            <h1 class="text-xl font-bold text-white">Pricing Engine</h1>
            <p class="text-sm text-slate-400 mt-1">Revenue Management System</p>
        </div>

        <!-- Login Form -->
        <div class="bg-white rounded-xl shadow-2xl p-8">
            <h2 class="text-lg font-semibold text-gray-900 mb-6">Sign in to your account</h2>

            {% if form.errors %}
            <div class="bg-red-50 border border-red-200 rounded-lg px-4 py-3 mb-5">
                <p class="text-sm text-red-700 font-medium">Invalid username or password. Please try again.</p>
            </div>
            {% endif %}

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}

                <div class="mb-4">
                    <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1.5">Username</label>
                    <input type="text" name="username" id="id_username" autofocus autocomplete="username"
                        class="input-field w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 transition"
                        placeholder="Enter your username">
                </div>

                <div class="mb-6">
                    <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
                    <input type="password" name="password" id="id_password" autocomplete="current-password"
                        class="input-field w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 transition"
                        placeholder="Enter your password">
                </div>

                {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
                {% endif %}

                <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-lg text-sm transition focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    Sign In
                </button>
            </form>
        </div>

        <p class="text-center text-xs text-slate-500 mt-6">Hotel Revenue Management System</p>
    </div>

</body>
</html>
